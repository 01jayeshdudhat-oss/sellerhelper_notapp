{% extends "base.html" %}

{% block title %}Shop page unavailable | SellerHelper{% endblock %}

{% block content %}
<main class="container py-5" style="max-width: 720px;">
    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-shop-window display-4 text-muted" aria-hidden="true"></i>
            <h1 class="h3 mt-3">{{ shop.name }} storefront is unavailable</h1>
            <p class="text-muted mb-0">This shop's storefront subscription is inactive or expired. Please contact the shop owner or platform administrator.</p>
        </div>
    </div>
</main>
{% endblock %}
